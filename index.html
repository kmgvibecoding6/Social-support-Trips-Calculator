<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Навигатор поддержки</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f5ff; --surface:#ffffff; --surface-2:#f4f0fd; --text:#1d1736; --muted:#6b6585; --border:#ebe5f7;
  --accent:#7c3aed; --accent-hover:#6d28d9; --accent-ink:#ffffff; --accent-soft:#f0e8ff;
  --ok:#0f8a4c; --ok-soft:#e3f7ec; --warn:#a15c00; --warn-soft:#fff2db; --bad:#c0263d; --bad-soft:#ffe9ec;
  --grad:linear-gradient(120deg,#7c3aed 0%,#db2777 55%,#f97316 100%);
  --shadow:0 1px 2px rgba(60,30,120,.05),0 8px 24px rgba(80,40,160,.08);
  --blob1:rgba(219,39,119,.12); --blob2:rgba(124,58,237,.12); --blob3:rgba(6,182,212,.10);
  --radius:20px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#120e22; --surface:#1b1630; --surface-2:#241e3d; --text:#f0ebff; --muted:#a69fc4; --border:#30294f;
    --accent:#a78bfa; --accent-hover:#c4b5fd; --accent-ink:#1a1033; --accent-soft:#2c2350;
    --ok:#4ade80; --ok-soft:#12291d; --warn:#fbbf24; --warn-soft:#2e2310; --bad:#fb7185; --bad-soft:#35141c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
    --blob1:rgba(219,39,119,.16); --blob2:rgba(124,58,237,.2); --blob3:rgba(6,182,212,.12);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#120e22; --surface:#1b1630; --surface-2:#241e3d; --text:#f0ebff; --muted:#a69fc4; --border:#30294f;
  --accent:#a78bfa; --accent-hover:#c4b5fd; --accent-ink:#1a1033; --accent-soft:#2c2350;
  --ok:#4ade80; --ok-soft:#12291d; --warn:#fbbf24; --warn-soft:#2e2310; --bad:#fb7185; --bad-soft:#35141c;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.3);
  --blob1:rgba(219,39,119,.16); --blob2:rgba(124,58,237,.2); --blob3:rgba(6,182,212,.12);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:
  radial-gradient(700px 420px at 105% -5%,var(--blob1),transparent 65%),
  radial-gradient(640px 420px at -10% 15%,var(--blob2),transparent 65%),
  radial-gradient(700px 500px at 50% 110%,var(--blob3),transparent 65%),
  var(--bg);
  background-attachment:fixed;color:var(--text);font:15px/1.55 Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
h1,h2,h3{line-height:1.25;margin:0 0 .5em;font-family:Montserrat,Inter,system-ui,sans-serif;font-weight:700}
h1{font-size:28px;letter-spacing:-.01em}
h2{font-size:20px}
h3{font-size:16px}
p{margin:0 0 .75em}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}

/* Header */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar-in{max-width:1160px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;color:var(--text);font-weight:700;white-space:nowrap}
.brand:hover{text-decoration:none}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:12px}
.nav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{padding:8px 12px;border-radius:9px;color:var(--muted);font-weight:500;white-space:nowrap}
.nav a:hover{background:var(--surface-2);color:var(--text);text-decoration:none}
.nav a.active{background:var(--accent-soft);color:var(--accent)}
.tools{display:flex;align-items:center;gap:8px}
.seg{display:inline-flex;border:1px solid var(--border);border-radius:9px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);padding:6px 10px;font:600 13px Inter,system-ui,sans-serif;cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.user{position:relative}
.user-btn{display:flex;align-items:center;gap:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:4px 10px 4px 4px;cursor:pointer;font:500 13px Inter,system-ui,sans-serif}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:12px}
.user-menu{position:absolute;right:0;top:calc(100% + 6px);width:280px;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:12px;display:none}
.user-menu.open{display:block}
.user-menu label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}

/* Layout */
main{max-width:1160px;margin:0 auto;padding:24px 16px 48px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card + .card{margin-top:16px}
.sticky{position:sticky;top:76px}
.section{margin-top:28px}
.section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:10px}
.crumbs a{color:var(--muted)}

/* Hero */
.hero{background:linear-gradient(135deg,var(--accent) 0%,#0d4f63 100%);color:#fff;border-radius:20px;padding:36px 32px;position:relative;overflow:hidden}
.hero h1{font-size:32px;color:#fff}
.hero p{color:rgba(255,255,255,.85);max-width:640px}
.search{position:relative;margin-top:18px;max-width:720px}
.search input{width:100%;padding:15px 16px 15px 46px;border-radius:12px;border:0;font:500 16px Inter,system-ui,sans-serif;background:#fff;color:#141a21;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.search svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:#5b6572}
.results{margin-top:10px;max-width:720px;background:var(--surface);color:var(--text);border-radius:12px;box-shadow:var(--shadow);overflow:hidden;display:none}
.results.show{display:block}
.results a{display:flex;gap:12px;align-items:center;padding:12px 16px;color:var(--text);border-top:1px solid var(--border)}
.results a:first-child{border-top:0}
.results a:hover{background:var(--surface-2);text-decoration:none}
.results .empty{padding:14px 16px;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.chip{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.1);color:#fff;border-radius:999px;padding:6px 12px;font:500 13px Inter,system-ui,sans-serif;cursor:pointer}
.chip:hover{background:rgba(255,255,255,.2)}

/* Tiles */
.tile{display:block;color:var(--text);transition:transform .12s ease,border-color .12s ease}
.tile:hover{text-decoration:none;transform:translateY(-2px);border-color:var(--accent)}
.tile-ico{width:42px;height:42px;border-radius:12px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin-bottom:12px}
.tile h3{margin-bottom:4px}

/* Pills, badges */
.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--surface-2);color:var(--muted);white-space:nowrap;vertical-align:middle}
.pill-ok{background:var(--ok-soft);color:var(--ok)}
.pill-warn{background:var(--warn-soft);color:var(--warn)}
.pill-bad{background:var(--bad-soft);color:var(--bad)}
.pill-acc{background:var(--accent-soft);color:var(--accent)}

/* Measure list */
.cat-filter{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.fbtn{border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:999px;padding:7px 14px;font:500 13px Inter,system-ui,sans-serif;cursor:pointer}
.fbtn.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mcard{display:flex;flex-direction:column;gap:8px;color:var(--text)}
.mcard:hover{text-decoration:none;border-color:var(--accent)}
.mcard .amt{font-size:18px;font-weight:700}
.mcard .row{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:auto}

/* Definition list */
.dl{display:grid;grid-template-columns:200px minmax(0,1fr);gap:10px 16px;margin:0}
.dl dt{color:var(--muted);font-size:13px;padding-top:1px}
.dl dd{margin:0}
.dl ul{margin:0;padding-left:18px}

/* Forms */
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:13px;font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=search],select{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font:15px Inter,system-ui,sans-serif}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:10px;padding:10px 16px;font:600 14px Inter,system-ui,sans-serif;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn:hover{background:var(--accent-hover);text-decoration:none}
.btn-ghost{background:transparent;color:var(--text);border-color:var(--border)}
.btn-ghost:hover{background:var(--surface-2)}
.btn-block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.hint{font-size:12px;color:var(--muted)}
.row-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

/* Result boxes */
.result{margin-top:16px;border-radius:12px;padding:16px;border:1px solid var(--border);background:var(--surface-2)}
.result.ok{background:var(--ok-soft);border-color:transparent}
.result.bad{background:var(--bad-soft);border-color:transparent}
.result.warn{background:var(--warn-soft);border-color:transparent}
.result h3{display:flex;align-items:center;gap:8px}
.result.ok h3{color:var(--ok)} .result.bad h3{color:var(--bad)} .result.warn h3{color:var(--warn)}
.sumrows{width:100%;border-collapse:collapse;margin-top:8px}
.sumrows td{padding:6px 0;border-top:1px dashed var(--border)}
.sumrows tr:first-child td{border-top:0}
.sumrows td:last-child{text-align:right;font-weight:600}
.sumrows tr.total td{font-size:17px;font-weight:700}
.note{margin-top:12px;font-size:12px;color:var(--muted);display:flex;gap:6px;align-items:flex-start}
.callout{border-left:3px solid var(--accent);background:var(--accent-soft);padding:12px 14px;border-radius:0 10px 10px 0;font-size:14px}
.callout.warn{border-color:var(--warn);background:var(--warn-soft)}

/* Tables */
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:12px}
table.t{width:100%;border-collapse:collapse;font-size:14px;background:var(--surface)}
table.t th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:600;background:var(--surface-2);padding:10px 12px;white-space:nowrap}
table.t td{padding:10px 12px;border-top:1px solid var(--border);vertical-align:top}
table.t td.r,table.t th.r{text-align:right}
table.t input{padding:6px 8px;max-width:140px}
.empty-row td{color:var(--muted);text-align:center;padding:24px}

/* Tabs */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:18px;overflow-x:auto}
.tabs button{border:0;background:transparent;padding:10px 14px;font:600 14px Inter,system-ui,sans-serif;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--accent);border-color:var(--accent)}

/* FAQ */
details.faq{border-top:1px solid var(--border);padding:12px 0}
details.faq:first-of-type{border-top:0}
details.faq summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between;gap:12px}
details.faq summary::-webkit-details-marker{display:none}
details.faq summary::after{content:"+";color:var(--muted);font-weight:400;font-size:20px;line-height:1}
details.faq[open] summary::after{content:"–"}
details.faq p{margin:8px 0 0;color:var(--muted)}

.stat{font-size:24px;font-weight:700}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--border);font-size:14px}
.kv:first-child{border-top:0}
.kv span:first-child{color:var(--muted)}
.checks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;max-height:180px;overflow:auto;border:1px solid var(--border);border-radius:10px;padding:10px}
.checks label{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:400}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:all .2s ease;z-index:50;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

footer{max-width:1160px;margin:0 auto;padding:0 16px 32px;color:var(--muted);font-size:12px}

/* ===== Яркое оформление ===== */
.topbar{background:color-mix(in srgb,var(--surface) 82%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:0;box-shadow:0 1px 0 var(--border)}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:var(--grad)}
.brand-mark{background:var(--grad);color:#fff;box-shadow:0 6px 16px rgba(219,39,119,.35)}
.brand{font-family:Montserrat,Inter,sans-serif}
.nav a.active{background:var(--grad);color:#fff;box-shadow:0 4px 12px rgba(124,58,237,.3)}
.seg button.on{background:var(--grad);color:#fff}
.avatar{background:var(--grad);color:#fff}

.card{border-color:var(--border)}
.btn{background:var(--grad);color:#fff;border-radius:999px;box-shadow:0 6px 18px rgba(219,39,119,.28);transition:transform .12s ease,box-shadow .12s ease,filter .12s ease}
.btn:hover{background:var(--grad);filter:brightness(1.07);transform:translateY(-1px);box-shadow:0 10px 24px rgba(219,39,119,.35)}
.btn-ghost{background:var(--surface);color:var(--text);box-shadow:none}
.btn-ghost:hover{background:var(--surface-2);filter:none}
.fbtn{font-weight:600}
.fbtn.on{background:var(--grad);border-color:transparent;color:#fff}
.tabs button.on{color:var(--accent);border-image:var(--grad) 1}
table.t th{background:var(--accent-soft);color:var(--accent)}
.callout{border-left:4px solid transparent;border-image:var(--grad) 1;background:var(--accent-soft);border-radius:0}

/* Hero */
.hero{background:var(--grad);padding:44px 40px;border-radius:28px;box-shadow:0 20px 50px rgba(124,58,237,.28);isolation:isolate}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;z-index:-1}
.hero::before{width:360px;height:360px;right:-90px;top:-140px;background:rgba(255,255,255,.14)}
.hero::after{width:220px;height:220px;left:-70px;bottom:-110px;background:rgba(255,214,102,.28)}
.hero h1{font-size:38px;font-weight:800;max-width:600px}
.hero-art{position:absolute;right:36px;top:50%;transform:translateY(-50%);width:300px;pointer-events:none}
.hero .search,.hero .chips,.hero p,.hero h1,.results{position:relative;z-index:1}
.results{position:relative}
.chip{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.45);font-weight:600}
.chip:hover{background:#fff;color:#7c3aed}

/* Плитки */
.tile{position:relative;overflow:hidden;border:0}
.tile::after{content:"";position:absolute;width:140px;height:140px;border-radius:50%;right:-50px;bottom:-60px;background:var(--g);opacity:.14;transition:transform .2s ease}
.tile:hover::after{transform:scale(1.25)}
.tile:hover{border-color:transparent;box-shadow:0 14px 30px rgba(80,40,160,.16)}
.tile-ico{background:var(--g,var(--grad));color:#fff;width:50px;height:50px;border-radius:16px;box-shadow:0 8px 18px rgba(0,0,0,.14)}

/* Цветные баннеры разделов */
.banner{background:var(--g);color:#fff;border-radius:24px;padding:26px 30px;display:flex;align-items:center;gap:20px;position:relative;overflow:hidden;margin-bottom:22px;box-shadow:0 14px 36px rgba(60,30,120,.2);isolation:isolate}
.banner::before{content:"";position:absolute;width:260px;height:260px;border-radius:50%;right:-60px;top:-120px;background:rgba(255,255,255,.16);z-index:-1}
.banner::after{content:"";position:absolute;width:120px;height:120px;border-radius:32px;right:120px;bottom:-70px;transform:rotate(25deg);background:rgba(255,255,255,.12);z-index:-1}
.banner h1{color:#fff;margin:0;font-size:28px;font-weight:800}
.banner p{color:rgba(255,255,255,.88);margin:4px 0 0}
.banner a{color:#fff;text-decoration:underline;text-underline-offset:3px}
.banner .crumbs{color:rgba(255,255,255,.8);margin:0 0 4px}
.banner .pill-warn{background:rgba(255,255,255,.25);color:#fff}
.b-ico{flex:none;width:64px;height:64px;border-radius:20px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-size:32px;line-height:1;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}

/* Карточки мер */
.mcard{position:relative;overflow:hidden;border:0;padding-top:24px}
.mcard::before{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:var(--c)}
.mcard:hover{box-shadow:0 14px 30px color-mix(in srgb,var(--c) 30%,transparent);transform:translateY(-2px)}
.mcard{transition:transform .12s ease,box-shadow .12s ease}
.mcard .emoji{position:absolute;right:16px;top:18px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:color-mix(in srgb,var(--c) 15%,transparent)}
.mcard h3{padding-right:52px}
.mcard .amt{color:var(--c)}
.pill-cat{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c)}

/* Цветные показатели командировки */
.statc{border-radius:18px;padding:16px;color:#fff;background:var(--g);box-shadow:0 8px 20px rgba(0,0,0,.12)}
.statc .muted{color:rgba(255,255,255,.85)}

@media (min-width:901px){ .hero .search,.hero .results,.hero .chips,.hero p{max-width:min(720px,calc(100% - 330px))} }
@media (max-width:900px){ .hero-art{display:none} }
@media (max-width:640px){
  .hero{padding:28px 20px;border-radius:22px}
  .hero h1{font-size:26px}
  .banner{padding:20px;gap:14px;border-radius:20px}
  .banner h1{font-size:21px}
  .b-ico{width:50px;height:50px;font-size:25px;border-radius:16px}
}

@media (max-width:900px){
  .split{grid-template-columns:1fr}
  .sticky{position:static}
  .g4{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:640px){
  .topbar-in{flex-wrap:wrap;gap:10px}
  .nav{order:3;flex-basis:100%}
  .tools{margin-left:auto}
  .brand small{display:none}
  .user-btn .uname{display:none}
  .hero{padding:24px 18px}
  .hero h1{font-size:24px}
  h1{font-size:23px}
  .g2,.g3,.g4,.row-fields,.checks{grid-template-columns:1fr}
  .dl{grid-template-columns:1fr;gap:2px}
  .dl dd{margin-bottom:10px}
  .card{padding:16px}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-in">
    <a class="brand" href="#/">
      <span class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5z"/></svg>
      </span>
      <span><span data-i="brand"></span><small data-i="brandSub"></small></span>
    </a>
    <nav class="nav" id="nav"></nav>
    <div class="tools">
      <div class="seg" role="group" aria-label="Язык / Тіл">
        <button data-lang="ru">RU</button><button data-lang="kz">ҚАЗ</button>

  if (!o) return '';
  if (o[state.lang]) return esc(o[state.lang]);
  const other = o.ru || o.kz;
  return other ? esc(other) + ' <span class="pill pill-warn">' + t('noTranslation') + '</span>' : '';
}
function money(n) { return n == null ? '—' : Math.round(n).toLocaleString('ru-RU').replace(/,/g, ' ') + ' ₸'; }
function num(n, d = 0) { return Number(n).toLocaleString('ru-RU', { minimumFractionDigits: d, maximumFractionDigits: d }); }
function curFmt(n, cur) { return cur === 'MRP' ? num(n, n % 1 ? 1 : 0) + ' ' + t('mrp') : num(n, n % 1 ? 2 : 0) + ' ' + cur; }
function dfmt(iso) { if (!iso) return '—'; const d = typeof iso === 'string' ? new Date(iso + 'T00:00:00') : iso; return d.toLocaleDateString('ru-RU'); }
function isoDate(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function baseFor(y) { return BASE[y] || BASE[Math.max(...Object.keys(BASE).map(Number))]; }
function measure(id) { return MEASURES.find(m => m.id === id); }
function cat(id) { return CATS.find(c => c.id === id); }
function yearsWord(n) {
  if (state.lang === 'kz') return n + ' жыл';
  const a = Math.abs(n) % 100, b = a % 10;
  return n + ' ' + (a > 10 && a < 20 ? 'лет' : b === 1 ? 'год' : b >= 2 && b <= 4 ? 'года' : 'лет');
}
function stazhYears(at = TODAY) { const h = new Date(PROFILE.hired + 'T00:00:00'); return (at - h) / (365.25 * 864e5); }
function stazhText() {
  const y = Math.floor(stazhYears()), mo = Math.floor((stazhYears() - y) * 12);
  return state.lang === 'kz' ? `${y} жыл ${mo} ай` : `${yearsWord(y)} ${mo} мес.`;
}
function needText(n) { return n < 1 ? (state.lang === 'kz' ? Math.round(n * 12) + ' ай' : Math.round(n * 12) + ' мес.') : yearsWord(n); }
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 3200); }

/* ---------- Логика мер ---------- */
function calcText(m) {
  const k = m.calc.k;
  switch (m.calc.type) {
    case 'fixed': return money(k);
    case 'mrp': return `${k} ${t('mrp')}`;
    case 'mzp': return `${k} ${t('mzp')}`;
    case 'salary': return state.lang === 'kz' ? (k === 1 ? '1 лауазымдық айлық' : `${k} айлық`) : (k === 1 ? '1 должностной оклад' : `${k} оклада`);
  }
}
function amountOf(m, salary, year = CUR_YEAR) {
  const b = baseFor(year), k = m.calc.k;
  switch (m.calc.type) {
    case 'fixed': return k;
    case 'mrp': return k * b.MRP;
    case 'mzp': return k * b.MZP;
    case 'salary': return salary > 0 ? k * salary : null;
  }
}
function amountPreview(m) {
  if (m.calc.type === 'salary') return calcText(m);
  return money(amountOf(m)) + (m.calc.type === 'fixed' ? '' : ' <span class="muted small">(' + calcText(m) + ')</span>');
}
function periodText(m) {
  if (m.period.type === 'event') return t('perEvent');
  const y = m.period.n === 1 ? t('oneYear') : t('nYears', { n: m.period.n });
  return t('perYears', { n: m.period.limit, y });
}
function limitText(m) { return m.period.type === 'event' ? t('noLimit') : t('limitTimes', { n: m.period.limit }); }
function condText(m) {
  const c = m.cond;
  if (c.benefit) return t('condBenefit', { b: L(BENEFITS[c.benefit]) });
  if (c.milestone) return t('condMilestone', { list: c.milestone.join(', ') });
  if (c.minYears) return t('condStazh', { n: needText(c.minYears) });
  return t('condNone');
}
function paymentsOf(emp, mid, year) { return PAYMENTS.filter(p => p.emp === emp && (!mid || p.m === mid) && (!year || +p.date.slice(0, 4) === year)); }
function limitState(m, emp = PROFILE.tab, year = CUR_YEAR) {
  if (m.period.type === 'event') return { event: true, exhausted: false };
  const from = year - m.period.n + 1;
  const used = PAYMENTS.filter(p => p.emp === emp && p.m === m.id && +p.date.slice(0, 4) >= from && +p.date.slice(0, 4) <= year).length;
  return { used, limit: m.period.limit, left: Math.max(0, m.period.limit - used), exhausted: used >= m.period.limit };
}
function checkConditions(m) {
  const c = m.cond, reasons = [];
  if (c.minYears && stazhYears() < c.minYears) reasons.push(t('reasonStazh', { have: stazhText(), need: needText(c.minYears) }));
  if (c.benefit) {
    const b = PROFILE.benefits.find(x => x.code === c.benefit);
    if (!b) reasons.push(t('reasonBenefit', { b: L(BENEFITS[c.benefit]) }));
    else if (b.status !== 'confirmed') reasons.push(t('reasonBenefitPending', { b: L(BENEFITS[c.benefit]) }));
  }
  if (c.milestone) {
    const n = CUR_YEAR - +PROFILE.hired.slice(0, 4);
    if (!c.milestone.includes(n)) reasons.push(t('reasonMilestone', { y: CUR_YEAR, n }));
  }
  return reasons;
}

/* ---------- Командировки ---------- */
function tripNorm(country, cityIdx, catNo) {
  const c = COUNTRIES.find(x => x.code === country); if (!c) return null;
  const city = cityIdx !== '' && cityIdx != null ? c.cities[+cityIdx] : null;
  const i = catNo - 1;
  const own = city && (city.hotel || city.daily);
  return { c, city, cur: c.cur, daily: (city && city.daily ? city.daily : c.daily)[i], hotel: (city && city.hotel ? city.hotel : c.hotel)[i], cityOwn: !!own };
}
function toKzt(v, cur) { return cur === 'MRP' ? v * baseFor(CUR_YEAR).MRP : cur === 'KZT' ? v : v * (RATES.list[cur] || 0); }

  const out = $('#calcOut');

  const salary = salaryEl ? Number(salaryEl.value) : 0;
  const reasons = checkConditions(m);
  const ls = limitState(m);
  const amount = amountOf(m, salary);
  let cls, head, icon;
  if (reasons.length) { cls = 'bad'; head = t('notEligible'); icon = IC.x; }
  else if (ls.exhausted) { cls = 'warn'; head = t('limitExhausted'); icon = IC.alert; reasons.push(t('reasonLimit', { used: ls.used, limit: ls.limit })); }
  else { cls = 'ok'; head = t('eligible'); icon = IC.check; }

  let rows = '';
  if (amount == null) rows = `<p class="small" style="margin:8px 0 0">${t('enterSalary')}</p>`;
  else {
    const ded = (m.deduct || []).map(d => ({ name: `${L(d)} ${d.pct}%`, v: amount * d.pct / 100 }));
    const net = amount - ded.reduce((s, d) => s + d.v, 0);
    rows = `<table class="sumrows num">
      <tr><td>${t('amount')} <span class="muted small">(${calcText(m)})</span></td><td>${money(amount)}</td></tr>
      ${ded.map(d => `<tr><td>${t('deduct')}: ${esc(d.name)}</td><td>− ${money(d.v)}</td></tr>`).join('')}
      <tr class="total"><td>${t('toPay')}</td><td>${money(net)}</td></tr></table>`;
  }
  const owner = OWNERS[m.owner];
  const tpl = m.tpl
    ? `<button class="btn btn-block" id="tplBtn" style="margin-top:14px">${IC.doc} ${t('tplDownload')}</button><p class="hint" style="text-align:center;margin-top:6px">${t('tplFormats')}</p>`
    : `<div class="callout warn" style="margin-top:14px">${t('tplMissing', { who: esc(L(owner)), contact: esc(owner.contact) })}</div>`;
  const docs = (m.docs[state.lang] && m.docs[state.lang].length ? m.docs[state.lang] : m.docs.ru);
  out.innerHTML = `
    <div class="result ${cls}">
      <h3>${icon} ${head}</h3>
      ${reasons.map(r => `<p class="small" style="margin:4px 0">${esc(r)}</p>`).join('')}
      ${rows}
    </div>
    <div class="note">${IC.info}<span>${t('disclaimer')}</span></div>
    ${tpl}
    <div style="margin-top:16px">

  wrap.innerHTML = `<div class="table-wrap"><table class="t">

function runPayCheck() {

  if (pays.length) {
    html = `<div class="result ok"><h3>${IC.check} ${t('stPaid')}</h3>${pays.map(p => `

function runTrip() {
  const out = $('#tripOut');
  const s = $('#tStart').value, e = $('#tEnd').value;
  const n = tripNorm($('#tCountry').value, $('#tCity').value, PROFILE.cat);
  renderNormTable(n.c);
  if (!s || !e) { out.innerHTML = ''; return; }
  const days = Math.round((new Date(e + 'T00:00:00') - new Date(s + 'T00:00:00')) / 864e5) + 1;
  if (days < 1) { out.innerHTML = `<div class="result bad"><h3>${IC.x} ${t('badDates')}</h3></div>`; return; }
  const nights = days - 1;
  const b = baseFor(CUR_YEAR);
  const dailyKzt = toKzt(n.daily, n.cur);
  const limMrp = n.c.code === 'KZ' ? b.PD_RK : b.PD_ABROAD;
  const limKzt = limMrp * b.MRP;
  const over = dailyKzt - limKzt;
  const rateLine = n.cur === 'MRP' ? `1 ${t('mrp')} = ${money(b.MRP)}` : `1 ${n.cur} = ${num(RATES.list[n.cur], 2)} ₸`;
  out.innerHTML = `
    <div class="grid g3" style="margin-top:4px">
      <div class="statc" style="--g:linear-gradient(120deg,#8b5cf6,#6366f1)"><div class="muted small">📅 ${t('days')}</div><div class="stat num">${days}</div></div>
      <div class="statc" style="--g:linear-gradient(120deg,#f59e0b,#ef4444)"><div class="muted small">🍽️ ${t('dailyTotal')}</div><div class="stat num">${money(dailyKzt * days)}</div></div>
      <div class="statc" style="--g:linear-gradient(120deg,#10b981,#0ea5e9)"><div class="muted small">🏨 ${t('hotelTotal')}</div><div class="stat num">${money(toKzt(n.hotel, n.cur) * nights)}</div></div>
    </div>
    <div class="table-wrap" style="margin-top:14px"><table class="t num">
      <thead><tr><th></th><th class="r">${t('inNorm')}</th><th class="r">${t('inKzt')}</th></tr></thead>
      <tbody>
        <tr><td>${t('dailyPer')}</td><td class="r">${curFmt(n.daily, n.cur)}</td><td class="r">${money(dailyKzt)}</td></tr>
        <tr><td>${t('dailyTotal')} <span class="muted small">× ${days}</span></td><td class="r"><strong>${curFmt(n.daily * days, n.cur)}</strong></td><td class="r"><strong>${money(dailyKzt * days)}</strong></td></tr>
        <tr><td>${t('hotelPer')}</td><td class="r">${curFmt(n.hotel, n.cur)}</td><td class="r">${money(toKzt(n.hotel, n.cur))}</td></tr>
        <tr><td>${t('hotelTotal')} <span class="muted small">× ${nights} ${state.lang === 'kz' ? 'түн' : 'ноч.'}</span></td><td class="r"><strong>${curFmt(n.hotel * nights, n.cur)}</strong></td><td class="r"><strong>${money(toKzt(n.hotel, n.cur) * nights)}</strong></td></tr>
      </tbody></table></div>
    <div class="result ${over > 0 ? 'warn' : 'ok'}" style="margin-top:14px">
      <p style="margin:0" class="small">${over > 0 ? IC.alert : IC.check} ${over > 0 ? t('taxOver', { lim: `${limMrp} ${t('mrp')} = ${money(limKzt)}`, over: money(over) }) : t('taxOk', { lim: `${limMrp} ${t('mrp')} = ${money(limKzt)}` })}</p>
    </div>
    <div class="note">${IC.pin}<span>${n.city ? (n.cityOwn ? t('cityNorm') : t('countryNorm')) : ''} ${t('nightsNote')}</span></div>
    <div class="note">${IC.info}<span>${t('kztNote', { d: dfmt(RATES.date) })} ${rateLine}.</span></div>`;
}

        <div class="field"><label for="rSum">${t('sum')}, ₸</label><input id="rSum" type="number" min="0" placeholder="0"></div>
      </div>
      <div class="field"><label for="rMeasure">${t('measure')}</label><select id="rMeasure">${MEASURES.map(m => `<option value="${m.id}">${esc(L(m.title))}</option>`).join('')}</select></div>
      <div class="field"><label>${t('employees')}</label><div class="checks">${EMPLOYEES.map(e => `<label><input type="checkbox" value="${e.tab}"> ${esc(e.fio)} <span class="muted small">${e.tab}</span></label>`).join('')}</div></div>
      <div id="rWarn"></div>
      <button class="btn" id="rSave">${t('save')}</button>
    </div>`}
    <div class="card"><h2>${t('tRegistry')}</h2>${registryTable()}</div>`;
  if (k === 'measures') return `<div class="table-wrap"><table class="t">
    <thead><tr><th>${t('measure')}</th><th>${t('calcType')}</th><th>${t('fPeriod')}</th><th>${t('fRule')}</th><th>${t('template')}</th></tr></thead>
    <tbody>${MEASURES.map(m => `<tr><td>${esc(L(m.title))}<div class="muted small">${esc(L(cat(m.cat)))}</div></td><td class="num">${calcText(m)}</td><td>${periodText(m)}</td><td>${esc(m.rule)}</td><td>${m.tpl ? `<span class="pill pill-ok">${t('yes')}</span>` : `<span class="pill pill-warn">${t('no')}</span>`}</td></tr>`).join('')}</tbody></table></div>`;
  if (k === 'base') {
    const years = Object.keys(BASE).sort().reverse();
    return `<div class="table-wrap"><table class="t num">
      <thead><tr><th>${t('year')}</th><th class="r">${t('mrp')}, ₸</th><th class="r">${t('mzp')}, ₸</th><th class="r">${t('pdRk')}</th><th class="r">${t('pdAbroad')}</th></tr></thead>
      <tbody>${years.map(y => `<tr><td><strong>${y}</strong></td>${['MRP', 'MZP', 'PD_RK', 'PD_ABROAD'].map(f => `<td class="r">${ro ? num(BASE[y][f]) : `<input type="number" data-base="${y}:${f}" value="${BASE[y][f]}" style="text-align:right">`}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>${ro ? '' : `<button class="btn" id="baseSave" style="margin-top:14px">${t('save')}</button>`}`;
  }
  if (k === 'rates') return `
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:14px"><button class="btn btn-ghost" id="ratesLoad">${t('loadRates')}</button><span class="muted small">${t('date')}: ${dfmt(RATES.date)}</span></div>
    <div class="table-wrap"><table class="t num">
      <thead><tr><th>${t('currency')}</th><th class="r">${t('rate')}</th><th>${t('source')}</th></tr></thead>
      <tbody>${Object.entries(RATES.list).map(([c, v]) => `<tr><td><strong>${c}</strong></td><td class="r"><input type="number" step="0.01" data-rate="${c}" value="${v}" style="text-align:right"></td><td>${RATES.manual && RATES.manual[c] ? `<span class="pill pill-warn">${t('srcManual')}</span>` : `<span class="pill pill-ok">${t('srcNb')}</span>`}</td></tr>`).join('')}</tbody>
    </table></div>`;
  if (k === 'norms') return `<div class="table-wrap"><table class="t num">
    <thead><tr><th>${t('country')}</th><th>${t('city')}</th><th>${t('currency')}</th><th class="r">${t('dailyPer')} 1/2/3</th><th class="r">${t('hotelPer')} 1/2/3</th><th>${t('validFrom')}</th></tr></thead>
    <tbody>${COUNTRIES.flatMap(c => [{ c, ct: null }].concat(c.cities.filter(ct => ct.hotel || ct.daily).map(ct => ({ c, ct })))).map(({ c, ct }) =>
      `<tr><td>${esc(L(c))}</td><td>${ct ? esc(L(ct)) : '<span class="muted">—</span>'}</td><td>${c.cur === 'MRP' ? t('mrp') : c.cur}</td><td class="r">${(ct && ct.daily || c.daily).join(' / ')}</td><td class="r">${(ct && ct.hotel || c.hotel).join(' / ')}</td><td>01.01.${CUR_YEAR}</td></tr>`).join('')}</tbody></table></div>`;
  if (k === 'users') {
    const roles = { employee: 'roleEmployee', hr: 'roleHr', acc: 'roleAcc', admin: 'roleAdmin' };
    return `<div class="table-wrap"><table class="t">
      <thead><tr><th>${t('tabNo')}</th><th>${t('employee')}</th><th>${t('role')}</th></tr></thead>
      <tbody>${EMPLOYEES.map(e => `<tr><td class="num">${e.tab}</td><td>${esc(e.fio)}</td><td><select data-user="${e.tab}" style="max-width:220px">${Object.entries(roles).map(([r, key]) => `<option value="${r}" ${e.role === r ? 'selected' : ''}>${t(key)}</option>`).join('')}</select></td></tr>`).join('')}</tbody></table></div>`;
  }
  if (k === 'journal') return `<div class="table-wrap"><table class="t">
    <thead><tr><th>${t('when')}</th><th>${t('who')}</th><th>${t('what')}</th></tr></thead>
    <tbody>${JOURNAL.slice().reverse().map(j => `<tr><td class="num" style="white-space:nowrap">${esc(j.at)}</td><td style="white-space:nowrap">${esc(j.who)}</td><td>${esc(L(j.what))}</td></tr>`).join('')}</tbody></table></div>`;
  return '';
}

function registryTable() {
  const rows = PAYMENTS.slice().sort((a, b) => b.date.localeCompare(a.date));
  return `<div class="table-wrap"><table class="t num">
    <thead><tr><th>${t('date')}</th><th>${t('employee')}</th><th>${t('measure')}</th><th>${t('order')}</th><th class="r">${t('sum')}</th><th>${t('enteredBy')}</th></tr></thead>
    <tbody>${rows.map(p => `<tr><td>${dfmt(p.date)}</td><td>${esc((EMPLOYEES.find(e => e.tab === p.emp) || {}).fio || p.emp)}</td><td>${esc(L(measure(p.m).title))}</td><td>№ ${esc(p.order)} ${t('from')} ${dfmt(p.orderDate)}</td><td class="r">${money(p.sum)}</td><td>${esc(p.by)}</td></tr>`).join('')}</tbody></table></div>`;
}

function actorName() { return { hr: 'Нурланов Е. К.', acc: 'Ким О. В.', admin: 'Оспанов Т. Б.' }[state.role] || PROFILE.short; }
function nowStamp() { const d = new Date(); return isoDate(d) + ' ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
function log(ru, kz) { JOURNAL.push({ at: nowStamp(), who: actorName(), what: { ru, kz } }); }

function bindAdmin() {
  $$('[data-tab]').forEach(b => b.onclick = () => { state.adminTab = b.dataset.tab; render(); });
  const save = $('#rSave');
  if (save) {
    let confirmed = false;
    const reset = () => { confirmed = false; save.textContent = t('save'); $('#rWarn').innerHTML = ''; };
    $$('#admBody .checks input, #rMeasure').forEach(el => el.addEventListener('change', reset));
    save.onclick = () => {
      const order = $('#rOrder').value.trim(), od = $('#rOrderDate').value, pd = $('#rDate').value, sum = +$('#rSum').value, mid = $('#rMeasure').value;
      const emps = $$('#admBody .checks input:checked').map(i => i.value);
      if (!order || !od || !pd || !(sum > 0) || !emps.length) { $('#rWarn').innerHTML = `<div class="callout warn" style="margin-bottom:12px">${t('fillAll')}</div>`; return; }
      const m = measure(mid), y = +pd.slice(0, 4);
      const over = emps.filter(e => limitState(m, e, y).exhausted);
      if (over.length && !confirmed) {
        confirmed = true; save.textContent = t('saveAnyway');
        $('#rWarn').innerHTML = `<div class="callout warn" style="margin-bottom:12px">${IC.alert} ${t('limitWarn', { list: over.map(e => esc(EMPLOYEES.find(x => x.tab === e).fio)).join(', ') })}</div>`;
        return;
      }
      emps.forEach(e => PAYMENTS.push({ emp: e, m: mid, sum, date: pd, order, orderDate: od, by: actorName() }));
      log(`Реестр: приказ № ${order}, «${m.title.ru}», ${emps.length} работн.`, `Тізілім: № ${order} бұйрық, «${m.title.kz}», ${emps.length} қызметкер`);
      toast(t('saved')); render();
    };
  }
  const bs = $('#baseSave');
  if (bs) bs.onclick = () => {
    $$('[data-base]').forEach(inp => {
      const [y, f] = inp.dataset.base.split(':'), v = +inp.value;
      if (v > 0 && v !== BASE[y][f]) { log(`Базовые величины ${y}: ${f} ${num(BASE[y][f])} → ${num(v)}`, `${y} базалық шамалары: ${f} ${num(BASE[y][f])} → ${num(v)}`); BASE[y][f] = v; }
    });
    toast(t('saved')); render();
  };
  $$('[data-rate]').forEach(inp => inp.onchange = () => {
    const c = inp.dataset.rate, v = +inp.value; if (!(v > 0)) return;
    log(`Курс ${c}: ${num(RATES.list[c], 2)} → ${num(v, 2)} (ручной ввод)`, `${c} бағамы: ${num(RATES.list[c], 2)} → ${num(v, 2)} (қолмен)`);
    RATES.list[c] = v; RATES.manual = RATES.manual || {}; RATES.manual[c] = true; render();
  });
  const rl = $('#ratesLoad'); if (rl) rl.onclick = () => { RATES.manual = {}; RATES.date = new Date(); toast(t('ratesLoaded')); render(); };
  $$('[data-user]').forEach(sel => sel.onchange = () => {
    const e = EMPLOYEES.find(x => x.tab === sel.dataset.user);
    log(`Роль ${e.fio}: ${e.role} → ${sel.value}`, `${e.fio} рөлі: ${e.role} → ${sel.value}`); e.role = sel.value; toast(t('saved'));
  });
}

/* ---------- Поиск ---------- */
const TRIP_WORDS = ['суточн', 'командир', 'проживан', 'гостиниц', 'отел', 'тәулік', 'іссапар', 'қонақ'];
function norm(s) { return s.toLowerCase().replace(/ё/g, 'е').replace(/[«»"().,]/g, ' '); }
function stem(w) { return w.length > 5 ? w.slice(0, w.length - 2) : w; }
function search(q) {
  const words = norm(q).split(/\s+/).filter(w => w.length > 1);
  if (!words.length) return [];
  const tripIntent = words.some(w => TRIP_WORDS.some(tw => w.startsWith(tw)));
  const rest = words.filter(w => !TRIP_WORDS.some(tw => w.startsWith(tw)) && !['по', 'в', 'на', 'при', 'для'].includes(w));
  const res = [];
  // страны и города
  COUNTRIES.forEach(c => {
    const cHay = norm(c.ru + ' ' + c.kz);
    if (rest.length && rest.every(w => cHay.includes(stem(w)))) res.push({ type: 'trip', href: `#/trips?c=${c.code}`, title: L(c), sub: t('navTrips'), score: 3 });
    c.cities.forEach((ct, i) => {
      const hay = norm(ct.ru + ' ' + ct.kz + ' ' + c.ru + ' ' + c.kz);
      if (rest.length && rest.every(w => hay.includes(stem(w))) && !cHay.includes(stem(rest[0]))) res.push({ type: 'trip', href: `#/trips?c=${c.code}&city=${i}`, title: `${L(ct)}, ${L(c)}`, sub: t('navTrips'), score: 3 });
    });
  });
  if (tripIntent && !res.length) res.push({ type: 'trip', href: '#/trips', title: t('tripTitle'), sub: t('navTrips'), score: 2 });
  // меры
  if (!tripIntent || !res.length) MEASURES.forEach(m => {
    const hay = norm([m.title.ru, m.title.kz, m.desc.ru, m.desc.kz, L(cat(m.cat)), ...(m.syn || [])].join(' '));
    const hits = words.filter(w => hay.includes(stem(w))).length;
    if (hits && hits >= Math.ceil(words.length / 2)) res.push({ type: 'm', href: `#/measure/${m.id}`, title: L(m.title), sub: `${L(cat(m.cat))} · ${calcText(m)}`, score: hits / words.length + (norm(L(m.title)).includes(stem(words[0])) ? 1 : 0) });
  });
  return res.sort((a, b) => b.score - a.score).slice(0, 7);
}
function showResults(q) {
  const box = $('#results');
  if (!q.trim()) { box.classList.remove('show'); return; }
  const r = search(q);
  box.innerHTML = r.length
    ? r.map(x => `<a href="${x.href}"><span class="tile-ico" style="width:34px;height:34px;margin:0;flex:none">${x.type === 'trip' ? IC.plane : IC.heart}</span><span><strong>${esc(x.title)}</strong><br><span class="muted small">${esc(x.sub)}</span></span></a>`).join('')
    : `<div class="empty">${t('searchEmpty')}</div>`;
  box.classList.add('show');
}

/* ============================================================
   РОУТИНГ И ОБЩИЙ КАРКАС
   ============================================================ */
/* Текущий маршрут хранится в памяти — навигация работает и там, где адресная строка недоступна (превью, data:-URL). */
let currentPath = (location.hash || '#/');
function go(href, push = true) {
  currentPath = href || '#/';
  if (push) { try { history.pushState(null, '', currentPath); } catch (e) { /* адрес не меняется — не страшно */ } }
  render(); window.scrollTo(0, 0);
}
function route() {
  const h = currentPath.replace(/^#\/?/, '');
  const [path, qs] = h.split('?');
  const parts = path.split('/').filter(Boolean);
  return { name: parts[0] || 'home', arg: parts[1], params: new URLSearchParams(qs || '') };
}

function renderChrome() {
  document.documentElement.lang = state.lang === 'kz' ? 'kk' : 'ru';
  if (state.theme === 'auto') document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', state.theme);
  $$('[data-i]').forEach(el => el.textContent = t(el.dataset.i));
  $$('[data-lang]').forEach(b => b.classList.toggle('on', b.dataset.lang === state.lang));
  const r = route().name;
  const items = [['home', 'navHome', '#/'], ['support', 'navSupport', '#/support'], ['payments', 'navPayments', '#/payments'], ['trips', 'navTrips', '#/trips'], ['info', 'navInfo', '#/info']];
  if (state.role !== 'employee') items.push(['admin', 'navAdmin', '#/admin']);
  const active = r === 'measure' ? 'support' : r;
  $('#nav').innerHTML = items.map(([k, key, href]) => `<a href="${href}" class="${active === k ? 'active' : ''}">${t(key)}</a>`).join('');
  $('#avatar').textContent = 'СА';
  $('#uname').textContent = PROFILE.short;
  const roles = [['employee', 'roleEmployee'], ['hr', 'roleHr'], ['acc', 'roleAcc'], ['admin', 'roleAdmin']];
  $('#userMenu').innerHTML = `
    <strong>${esc(PROFILE.fio)}</strong>
    <div class="muted small">${esc(L(PROFILE.pos))} · ${PROFILE.tab}</div>
    <div class="small" style="margin-top:6px;color:var(--ok)">${IC.check} ${t('sso')}</div>
    <label for="roleSel">${t('role')}</label>
    <select id="roleSel">${roles.map(([v, k]) => `<option value="${v}" ${state.role === v ? 'selected' : ''}>${t(k)}</option>`).join('')}</select>
    <label>${t('theme')}</label>
    <div class="seg" style="width:100%">${[['auto', 'themeAuto'], ['light', 'themeLight'], ['dark', 'themeDark']].map(([v, k]) => `<button data-theme-set="${v}" class="${state.theme === v ? 'on' : ''}" style="flex:1">${t(k)}</button>`).join('')}</div>`;
  $('#roleSel').onchange = e => { state.role = e.target.value; if (state.role !== 'employee') go('#/admin'); else render(); $('#userMenu').classList.add('open'); };
  $$('[data-theme-set]').forEach(b => b.onclick = () => { state.theme = b.dataset.themeSet; store('nav-theme', state.theme); renderChrome(); $('#userMenu').classList.add('open'); });
  $('#footer').textContent = t('footer');
}

function render() {
  renderChrome();
  const r = route(), app = $('#app');
  switch (r.name) {
    case 'support': app.innerHTML = pageSupport(); $$('[data-cat]').forEach(b => b.onclick = () => { state.catFilter = b.dataset.cat; render(); }); break;
    case 'measure': {
      app.innerHTML = pageMeasure(r.arg);
      const m = measure(r.arg);
      if (m) { $('#calcBtn').onclick = () => runCalc(m); const s = $('#salary'); if (s) s.addEventListener('keydown', e => { if (e.key === 'Enter') runCalc(m); }); }
      break;
    }
    case 'payments':
      app.innerHTML = pagePayments();
      $('#fMeasure').onchange = $('#fYear').onchange = renderPayTable; renderPayTable();
      $('#cBtn').onclick = runPayCheck;
      break;
    case 'trips':
      app.innerHTML = pageTrips(r.params);
      fillCities(r.params.get('city') ?? '');
      $('#tCountry').onchange = () => { fillCities(); runTrip(); };
      ['#tCity', '#tStart', '#tEnd'].forEach(s => $(s).onchange = runTrip);
      runTrip();
      break;
    case 'info':
      app.innerHTML = pageInfo();
      $('#faqQ').oninput = e => { const q = norm(e.target.value); $$('#faqList details').forEach(d => { const hit = !q || norm(d.textContent).includes(q); d.style.display = hit ? '' : 'none'; if (q && hit) d.open = true; }); };
      break;
    case 'admin': app.innerHTML = pageAdmin(); bindAdmin(); break;
    default:
      app.innerHTML = pageHome();
      const q = $('#q');
      q.oninput = () => showResults(q.value);
      q.onkeydown = e => { if (e.key === 'Enter') { const first = $('#results a'); if (first) go(first.getAttribute('href')); } };
      $$('[data-q]').forEach(c => c.onclick = () => { q.value = c.dataset.q; showResults(q.value); q.focus(); });
  }
}

/* Глобальные обработчики */
$$('[data-lang]').forEach(b => b.onclick = () => { state.lang = b.dataset.lang; store('nav-lang', state.lang); render(); });
$('#userBtn').onclick = e => { e.stopPropagation(); $('#userMenu').classList.toggle('open'); };
document.addEventListener('click', e => {
  if (!e.target.closest('.user')) $('#userMenu').classList.remove('open');
  const a = e.target.closest('a[href^="#/"]');
  if (a && !e.ctrlKey && !e.metaKey && !e.shiftKey) { e.preventDefault(); go(a.getAttribute('href')); }
});
window.addEventListener('hashchange', () => { if (location.hash && location.hash !== currentPath) go(location.hash, false); });
window.addEventListener('popstate', () => go(location.hash || '#/', false));
render();
</script>
